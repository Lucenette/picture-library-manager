name: 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: 先说清楚痛点，再说方案。"我想要 X" 不如"我在做 Y 时被 Z 卡住了"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
      description: 界面怎么走、行为是什么样
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现在是怎么绕过去的？用脚本能做到吗？
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 需要改数据库结构
        - 需要新增任务类型
        - 需要改脚本接口（破坏兼容）
        - 只涉及界面
        - 只涉及文档
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，没有重复
          required: true
