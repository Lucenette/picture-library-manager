version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "依赖"
    groups:
      electron:
        patterns:
          - electron
          - electron-vite
          - electron-builder
      vue:
        patterns:
          - vue
          - vue-router
          - "@vue/*"
          - element-plus
          - "@element-plus/*"
      image:
        patterns:
          - image-size
          - sharp
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "CI"
