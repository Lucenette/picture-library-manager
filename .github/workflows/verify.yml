# push / PR 到 master 与 develop：文档检查、代码规范检查、类型检查 + 三目标构建（不发布）。
# 发布走另一个工作流：release.yml（只有 master 上的 tag 会触发）。
name: 校验

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: 文档检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 文档与 skill 检查（零依赖）
        run: node scripts/check-docs.mjs

  check:
    name: 代码规范检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: 安装依赖
        # ESLint 及其插件是 devDependencies，必须装依赖；
        # --ignore-scripts 跳过原生模块（sharp / electron）的安装脚本，只取纯 JS 部分。
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000
      - name: 代码规范检查
        run: yarn lint
      - name: 导出符号 JSDoc 检查
        run: node scripts/check-jsdoc.mjs

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: 安装依赖
        # vitest 的 esbuild / rollup 平台包走 optionalDependencies，--ignore-scripts 足够；
        # 若某次升级后平台包缺失，改成完整 yarn install 即可。
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000
      - name: 主进程与 Node 侧测试
        run: yarn test:main
      - name: 渲染进程测试
        run: yarn test:renderer

  verify:
    name: 类型检查与构建
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: 安装依赖
        run: yarn install --frozen-lockfile --network-timeout 600000
      - name: 类型检查
        run: yarn typecheck
      - name: 构建三个目标
        # 覆盖 main / preload / renderer，包含 ?nodeWorker 产出的 worker chunk
        # 只验证能否打包，不产出安装程序（NSIS 打包请在发布流程里手动执行）
        run: npx electron-vite build
