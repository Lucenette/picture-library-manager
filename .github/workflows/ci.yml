name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查与构建
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # 注意：未启用 setup-node 的 yarn 缓存，因为仓库当前未跟踪 yarn.lock

      - name: 安装依赖
        # yarn.lock 目前被 .gitignore 忽略，因此不能用 --frozen-lockfile
        run: yarn install --network-timeout 600000

      - name: 类型检查
        run: yarn typecheck

      - name: 构建三个目标
        # 覆盖 main / preload / renderer，包含 ?nodeWorker 产出的 worker chunk
        # 只验证能否打包，不产出安装程序（NSIS 打包请在发布流程里手动执行）
        run: npx electron-vite build
