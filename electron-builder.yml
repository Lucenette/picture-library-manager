appId: com.lucenette.picture-library-manager
productName: PLManager
copyright: MIT

directories:
  output: dist

files:
  - out/**/*
  - package.json

npmRebuild: false
asar: false

# 图标由 electron-builder 自己从这张 1024×1024 的 PNG 现场生成（icns / ico / Linux 图标集），
# 不再需要 electron-icon-builder：icns 要求源图 ≥512、ico 要求 ≥256。
win:
  target:
    - target: nsis
      arch: [x64]
  icon: src/static/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}_Setup_${version}.${ext}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: src/static/icon.png
  category: public.app-category.graphics-design

linux:
  target:
    - AppImage
    - deb
  icon: src/static/icon.png
  category: Graphics
  maintainer: Lucenette
