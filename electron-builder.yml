appId: com.lucenette.picture-library-manager
productName: PLManager
copyright: MIT

directories:
  output: dist

files:
  - out/**/*
  - package.json

npmRebuild: false
asar: false

# 图标由 electron-builder 自己从这张 1024×1024 的 PNG 现场生成（icns / ico / Linux 图标集），
# 不再需要 electron-icon-builder：icns 要求源图 ≥512、ico 要求 ≥256。
win:
  target:
    - target: nsis
      arch: [x64]
  icon: src/static/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}_Setup_${version}.${ext}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: src/static/icon.png
  category: public.app-category.graphics-design

linux:
  target:
    - AppImage
    - deb
  icon: src/static/icon.png
  category: Graphics
  maintainer: Lucenette
  # package.json 的 desktopName 是 Electron 的 app_id，也就是窗口的 WM_CLASS；打开这个开关，
  # .desktop 才会装成 ${desktopName}.desktop 并写同一个 StartupWMClass——两边一致，桌面环境
  # 才能把运行中的窗口认到启动器上（否则 GNOME/KDE 当成来历不明的窗口）。v27 起是默认行为、
  # 开关已移除；26 必须显式打开。它不改 Icon（那个仍取 executableName）。
  syncDesktopName: true
